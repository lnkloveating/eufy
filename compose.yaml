name: eufy-futurelab

services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      APP_ENV: production
      DATABASE_URL: sqlite:////var/lib/eufy/app.db
      EVIDENCE_PATH: /app/data/evidence
      COMPETITOR_EVIDENCE_PATH: /app/data/competitors
      LLM_API_KEY: ${LLM_API_KEY:?Set LLM_API_KEY in the root .env file}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-120}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-2}
      LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-6000}
      STAGE_TIMEOUT_SECONDS: ${STAGE_TIMEOUT_SECONDS:-75}
      WORKFLOW_TIMEOUT_SECONDS: ${WORKFLOW_TIMEOUT_SECONDS:-900}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost}
      FEISHU_APP_ID: ${FEISHU_APP_ID:-}
      FEISHU_APP_SECRET: ${FEISHU_APP_SECRET:-}
      FEISHU_BITABLE_APP_TOKEN: ${FEISHU_BITABLE_APP_TOKEN:-}
      FEISHU_WIKI_NODE_TOKEN: ${FEISHU_WIKI_NODE_TOKEN:-}
      FEISHU_BITABLE_TABLE_ID: ${FEISHU_BITABLE_TABLE_ID:-}
      FEISHU_BITABLE_VIEW_ID: ${FEISHU_BITABLE_VIEW_ID:-}
      FEISHU_BITABLE_URL: ${FEISHU_BITABLE_URL:-}
    volumes:
      - backend_data:/var/lib/eufy
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  web:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api/v1
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${APP_PORT:-80}:80"

volumes:
  backend_data:
